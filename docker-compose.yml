services:
    configuration-server:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: configuration-server
        ports:
            - "8888:8888"
        environment:
            SERVER_PORT: 8888
            SPRING_PROFILES_ACTIVE: dev
            CONFIG_REPO_URL: 'https://github.com/scriptmage/notirail-configuration.git'
            CONFIG_REPO_DEFAULT_BRANCH: main
            ENCRYPT_KEY: ${CONFIG_SERVER_ENCRYPT_KEY}
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:8888/actuator/health || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 45s
